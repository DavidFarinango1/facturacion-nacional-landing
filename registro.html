<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro Corporativo — AND Local Ads</title>
  <meta name="description" content="Crea tu cuenta empresarial en AND Local Ads y optimiza tu gestión financiera." />
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">

  <div class="topbar">
    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <main class="auth">
    <div class="auth__glow auth__glow--a" aria-hidden="true"></div>
    <div class="auth__glow auth__glow--b" aria-hidden="true"></div>

    <div class="auth__wrap">
      <a href="index.html" class="auth__back">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>
        Volver al inicio
      </a>

      <section class="auth__card">
        <header class="register__head">
          <span class="register__icon">
            <svg width="26" height="26" viewBox="0 0 256 256" fill="currentColor"><path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.88-13.32L39.12,72A16,16,0,0,0,32,85.34V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM208,96V208H144V96ZM48,85.34,128,32V208H48ZM112,112v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm-32,0v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm0,56v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Zm32,0v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Z"/></svg>
          </span>
          <div>
            <h1 class="register__title">Registro Corporativo</h1>
            <p>Optimiza tu gestión financiera</p>
          </div>
        </header>

        <form id="registerForm" class="register__form" novalidate>
          <div class="rfield">
            <label for="rCompany">Nombre de la Empresa</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.88-13.32L39.12,72A16,16,0,0,0,32,85.34V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM208,96V208H144V96ZM48,85.34,128,32V208H48ZM112,112v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm-32,0v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm0,56v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Zm32,0v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Z"/></svg>
              <input id="rCompany" name="company" type="text" required placeholder="Ej. Tech Solutions S.A.C." />
            </div>
          </div>

          <div class="rfield">
            <label for="rEmail">Correo Corporativo</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48Zm-96,85.15L52.57,64H203.43ZM98.71,128,40,181.81V74.19Zm11.84,10.85,12,11.05a8,8,0,0,0,10.82,0l12-11.05,58,53.15H52.57ZM157.29,128,216,74.18V181.82Z"/></svg>
              <input id="rEmail" name="email" type="email" required placeholder="contacto@empresa.com" autocomplete="email" />
            </div>
          </div>

          <div class="rfield">
            <label for="rRuc">RUC / Identificación Fiscal</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M200,112a8,8,0,0,1-8,8H152a8,8,0,0,1,0-16h40A8,8,0,0,1,200,112Zm-8,24H152a8,8,0,0,0,0,16h40a8,8,0,0,0,0-16Zm40-80V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56ZM216,200V56H40V200H216Zm-80.26-34a8,8,0,1,1-15.5,4c-2.63-10.26-13.06-18-24.25-18s-21.61,7.74-24.25,18a8,8,0,1,1-15.5-4,39.84,39.84,0,0,1,17.19-23.34,32,32,0,1,1,45.12,0A39.76,39.76,0,0,1,135.75,166ZM96,136a16,16,0,1,0-16-16A16,16,0,0,0,96,136Z"/></svg>
              <input id="rRuc" name="ruc" type="text" inputmode="numeric" required placeholder="20123456789" />
            </div>
          </div>

          <div class="rfield">
            <label for="rPhone">Teléfono</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M222.37,158.46l-47.11-21.11-.13-.06a16,16,0,0,0-15.17,1.4,8.12,8.12,0,0,0-.75.56L134.87,160c-15.42-7.49-31.34-23.29-38.83-38.51l20.78-24.71c.2-.25.39-.5.57-.77a16,16,0,0,0,1.32-15.06l0-.12L97.54,33.64a16,16,0,0,0-16.62-9.52A56.26,56.26,0,0,0,32,80c0,79.4,64.6,144,144,144a56.26,56.26,0,0,0,55.88-48.92A16,16,0,0,0,222.37,158.46ZM176,208A128.14,128.14,0,0,1,48,80,40.2,40.2,0,0,1,82.87,40a.61.61,0,0,0,0,.12l21,47L83.2,111.86a6.13,6.13,0,0,0-.57.77,16,16,0,0,0-1,15.7c9.06,18.53,27.73,37.06,46.46,46.11a16,16,0,0,0,15.75-1.14,8.44,8.44,0,0,0,.74-.56L168.89,152l47,21.05h0s.08,0,.11,0A40.21,40.21,0,0,1,176,208Z"/></svg>
              <input id="rPhone" name="phone" type="tel" required placeholder="+593 99 999 9999" autocomplete="tel" />
            </div>
          </div>

          <div class="rfield">
            <label for="rCity">Ciudad</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,64a40,40,0,1,0,40,40A40,40,0,0,0,128,64Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,128Zm0-112a88.1,88.1,0,0,0-88,88c0,31.4,14.51,64.68,42,96.25a254.19,254.19,0,0,0,41.45,38.3,8,8,0,0,0,9.18,0A254.19,254.19,0,0,0,174,200.25c27.45-31.57,42-64.85,42-96.25A88.1,88.1,0,0,0,128,16Zm0,206c-16.53-13-72-60.75-72-118a72,72,0,0,1,144,0C200,161.23,144.53,209,128,222Z"/></svg>
              <input id="rCity" name="city" type="text" required placeholder="Quito" />
            </div>
          </div>

          <div class="rfield">
            <label for="rPass">Contraseña</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"/></svg>
              <input id="rPass" name="password" type="password" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
            </div>
          </div>

          <div class="rfield">
            <label for="rPass2">Confirmar Contraseña</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"/></svg>
              <input id="rPass2" name="password2" type="password" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
            </div>
          </div>

          <label class="register__terms">
            <input type="checkbox" id="rTerms" name="terms" required />
            <span>Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>.</span>
          </label>

          <button type="submit" id="registerSubmit" class="btn btn--block" disabled>
            Crear Cuenta Empresarial
            <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" class="btn__arrow"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
          </button>
          <p id="registerStatus" class="register__status" role="status" aria-live="polite"></p>
        </form>

        <footer class="auth__foot">
          <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </footer>
      </section>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
