<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Factura — AND Local Ads</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #101318; --muted: #62748e; --line: #e2e8f0; --blue: #1e3a8a; --blue2: #3b82f6; --yellow: #facc15; --ok: #16a34a; --warn: #ca8a04; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Montserrat", system-ui, sans-serif; background: #eef1f5; color: var(--ink); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .85rem 1.5rem; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
    .bar a, .bar button { font: inherit; font-size: .85rem; font-weight: 600; padding: .55rem 1rem; border-radius: .5rem; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; }
    .bar .primary { background: var(--blue2); border-color: var(--blue2); color: #fff; }
    .sheet { width: 210mm; max-width: 100%; margin: 1.5rem auto; background: #fff; padding: 18mm 16mm; box-shadow: 0 10px 40px rgba(0,0,0,.08); min-height: 280mm; position: relative; }
    .head { display: flex; justify-content: space-between; gap: 2rem; border-bottom: 3px solid var(--blue); padding-bottom: 1.25rem; }
    .head img { height: 64px; }
    .head .brand p { margin: .35rem 0 0; font-size: .78rem; color: var(--muted); line-height: 1.5; }
    .meta { text-align: right; }
    .meta h1 { margin: 0; font-size: 1.4rem; color: var(--blue); letter-spacing: .04em; }
    .meta .num { font-size: 1.05rem; font-weight: 700; margin-top: .25rem; }
    .meta p { margin: .2rem 0 0; font-size: .8rem; color: var(--muted); }
    .status { display: inline-block; margin-top: .5rem; padding: .25rem .7rem; border-radius: 9999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
    .status--pagada { background: rgba(22,163,74,.12); color: var(--ok); }
    .status--pendiente, .status--en_revision { background: rgba(202,138,4,.14); color: var(--warn); }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin: 1.5rem 0; font-size: .85rem; }
    .parties h3 { margin: 0 0 .4rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .parties p { margin: .15rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: .5rem; }
    th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: .6rem .5rem; border-bottom: 2px solid var(--line); }
    td { padding: .7rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td small { display: block; color: var(--muted); font-size: .75rem; margin-top: .15rem; }
    .totals { margin-left: auto; width: 320px; margin-top: 1rem; font-size: .88rem; }
    .totals div { display: flex; justify-content: space-between; padding: .4rem .5rem; }
    .totals .grand { border-top: 2px solid var(--blue); margin-top: .35rem; padding-top: .6rem; font-size: 1.15rem; font-weight: 800; color: var(--blue); }
    .note { margin-top: 2rem; padding: 1rem 1.25rem; background: #f8fafc; border-left: 4px solid var(--yellow); font-size: .8rem; line-height: 1.6; }
    .foot { position: absolute; left: 16mm; right: 16mm; bottom: 12mm; font-size: .72rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .75rem; display: flex; justify-content: space-between; }
    .err { max-width: 560px; margin: 4rem auto; background: #fff; padding: 2rem; border-radius: 1rem; text-align: center; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { width: auto; margin: 0; box-shadow: none; padding: 12mm; min-height: auto; }
      .foot { position: fixed; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="#" id="backLink">← Volver al panel</a>
    <div>
      <button id="printBtn" class="primary">Imprimir / Guardar como PDF</button>
    </div>
  </div>
  <div id="doc"></div>

  <script src="js/store.js"></script>
  <script>
  (function () {
    "use strict";
    const S = window.ANDStore;
    const session = S.getSession();
    const id = (location.hash || "").replace("#", "");
    const inv = id ? S.getInvoice(id) : null;
    const doc = document.getElementById("doc");
    const back = document.getElementById("backLink");
    back.href = session && session.role === "admin" ? "admin.html#invoices" : "empresa.html";

    if (!session) { location.replace("login.html"); return; }
    if (!inv || (session.role === "empresa" && inv.companyId !== session.id)) {
      doc.innerHTML = '<div class="err"><h2>Factura no encontrada</h2><p>No existe o no tienes permiso para verla.</p></div>';
      return;
    }
    const c = S.getCompany(inv.companyId) || {};
    const s = S.getSettings();
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
    const f = function (n) { return money.format(n); };
    const d = function (iso) { return iso ? new Date(iso).toLocaleDateString("es-EC", { day: "2-digit", month: "long", year: "numeric" }) : "—"; };
    const esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); };
    const STATUS = { pendiente: "Pendiente de pago", en_revision: "Pago en revisión", pagada: "Pagada" };
    const pct = function (v) { return (v * 100).toFixed(v * 100 % 1 === 0 ? 0 : 1) + "%"; };

    document.title = "Factura " + inv.number + " — " + c.company;
    doc.innerHTML = '\
<div class="sheet">\
  <div class="head">\
    <div class="brand"><img src="assets/logos-01.png" alt="AND Marketing Digital" /><p><strong>AND Technologies</strong><br />Quito, Ecuador · RUC 1793000000001<br />facturacion@andlocalads.com</p></div>\
    <div class="meta"><h1>FACTURA</h1><div class="num">N.º ' + esc(inv.number) + '</div><p>Fecha de emisión: ' + d(inv.createdAt) + '</p>' + (inv.paidAt ? '<p>Fecha de pago: ' + d(inv.paidAt) + '</p>' : '') + '<span class="status status--' + inv.status + '">' + STATUS[inv.status] + '</span></div>\
  </div>\
  <div class="parties">\
    <div><h3>Cliente</h3><p><strong>' + esc(c.company) + '</strong></p><p>RUC: ' + esc(c.ruc) + '</p><p>' + esc(c.city) + '</p><p>' + esc(c.email) + '</p><p>' + esc(c.phone) + '</p></div>\
    <div><h3>Concepto</h3><p>Servicio de gestión y nacionalización de pauta publicitaria digital.</p><p>Plataformas: Meta Ads, Google Ads, TikTok Ads, X Ads.</p><p>Forma de pago: transferencia a cuenta local de AND.</p></div>\
  </div>\
  <table><thead><tr><th>Descripción</th><th class="num">Base</th><th class="num">Tarifa</th><th class="num">Valor</th></tr></thead><tbody>\
    <tr><td>Inversión en pauta publicitaria<small>Saldo que se acredita en tu cuenta publicitaria al confirmarse el pago</small></td><td class="num">' + f(inv.amount) + '</td><td class="num">—</td><td class="num">' + f(inv.amount) + '</td></tr>\
    <tr><td>ISD — Impuesto a la Salida de Divisas</td><td class="num">' + f(inv.amount) + '</td><td class="num">' + pct(inv.isd / inv.amount) + '</td><td class="num">' + f(inv.isd) + '</td></tr>\
    <tr><td>Comisión de gestión AND</td><td class="num">' + f(inv.amount) + '</td><td class="num">' + pct(inv.fee / inv.amount) + '</td><td class="num">' + f(inv.fee) + '</td></tr>\
  </tbody></table>\
  <div class="totals">\
    <div><span>Subtotal</span><span>' + f(inv.amount + inv.isd + inv.fee) + '</span></div>\
    <div><span>IVA ' + pct(inv.iva / (inv.amount + inv.isd + inv.fee)) + ' <em style="color:var(--muted);font-style:normal">(crédito tributario)</em></span><span>' + f(inv.iva) + '</span></div>\
    <div class="grand"><span>TOTAL</span><span>' + f(inv.total) + '</span></div>\
  </div>\
  <div class="note"><strong>Factura válida fiscalmente en Ecuador.</strong> El IVA de este documento es crédito tributario para tu empresa y el gasto es 100% deducible del Impuesto a la Renta. Comparado con pagar la pauta directamente al exterior, este comprobante evita el ' + pct(s.nonDeductible) + ' de gasto no deducible.</div>\
  <div class="foot"><span>AND Local Ads — Factura local, sin complicaciones.</span><span>' + esc(inv.number) + ' · Generada el ' + d(new Date().toISOString()) + '</span></div>\
</div>';
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
  })();
  </script>
</body>
</html>
