<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — AND Local Ads</title>
  <meta name="description" content="Accede a tu panel de control de AND Local Ads." />
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">

  <div class="topbar">
    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <main class="auth">
    <div class="auth__glow auth__glow--a" aria-hidden="true"></div>
    <div class="auth__glow auth__glow--b" aria-hidden="true"></div>

    <div class="auth__wrap">
      <a href="index.html" class="auth__back">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>
        Volver al inicio
      </a>

      <section class="auth__card">
        <header class="auth__head">
          <img src="assets/logos-01.png" alt="AND Marketing Digital" class="auth__logo only-light" />
          <img src="assets/logos-02.png" alt="AND Marketing Digital" class="auth__logo only-dark" />
          <h1>Bienvenido de nuevo</h1>
          <p>Accede a tu panel de control</p>
        </header>

        <form id="loginForm" class="auth__form" novalidate>
          <div class="auth__group">
            <label class="auth__label">Tipo de acceso</label>
            <div class="access" role="radiogroup" aria-label="Tipo de acceso">
              <button type="button" class="access__btn is-active" data-role="empresa" role="radio" aria-checked="true">
                <svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor"><path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.88-13.32L39.12,72A16,16,0,0,0,32,85.34V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM208,96V208H144V96ZM48,85.34,128,32V208H48ZM112,112v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm-32,0v16a8,8,0,0,1-16,0V112a8,8,0,1,1,16,0Zm0,56v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Zm32,0v16a8,8,0,0,1-16,0V168a8,8,0,0,1,16,0Z"/></svg>
                <span>Empresa</span>
              </button>
              <button type="button" class="access__btn" data-role="admin" role="radio" aria-checked="false">
                <svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor"><path d="M216.57,39.43A80,80,0,0,0,83.91,120.78L28.69,176A15.86,15.86,0,0,0,24,187.31V216a16,16,0,0,0,16,16H72a8,8,0,0,0,8-8V208H96a8,8,0,0,0,8-8V184h16a8,8,0,0,0,5.66-2.34l9.56-9.57A79.73,79.73,0,0,0,160,176h.1A80,80,0,0,0,216.57,39.43ZM224,98.1c-1.09,34.09-29.75,61.86-63.89,61.9H160a63.7,63.7,0,0,1-23.65-4.51,8,8,0,0,0-8.84,1.68L116.69,168H96a8,8,0,0,0-8,8v16H72a8,8,0,0,0-8,8v16H40V187.31l58.83-58.82a8,8,0,0,0,1.68-8.84A63.72,63.72,0,0,1,96,96c0-34.15,27.77-62.81,61.9-63.9A64,64,0,0,1,224,98.1ZM192,76a12,12,0,1,1-12-12A12,12,0,0,1,192,76Z"/></svg>
                <span>Admin AND</span>
              </button>
            </div>
          </div>

          <div class="rfield">
            <label for="loginEmail">Correo Electrónico</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48Zm-96,85.15L52.57,64H203.43ZM98.71,128,40,181.81V74.19Zm11.84,10.85,12,11.05a8,8,0,0,0,10.82,0l12-11.05,58,53.15H52.57ZM157.29,128,216,74.18V181.82Z"/></svg>
              <input id="loginEmail" name="email" type="email" required placeholder="tu@email.com" autocomplete="email" />
            </div>
          </div>

          <div class="rfield">
            <label for="loginPass">Contraseña</label>
            <div class="rfield__wrap">
              <svg class="rfield__icon" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"/></svg>
              <input id="loginPass" name="password" type="password" required placeholder="••••••••" autocomplete="current-password" class="has-eye" />
              <button type="button" class="rfield__eye" data-toggle-pass="loginPass" aria-label="Mostrar contraseña">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
                <svg class="eye-closed" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M53.92,34.62A8,8,0,1,0,42.08,45.38L61.32,66.55C25,88.84,9.38,123.2,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208a127.11,127.11,0,0,0,52.07-10.83l22,24.21a8,8,0,1,0,11.84-10.76Zm47.33,75.84,41.67,45.85a32,32,0,0,1-41.67-45.85ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.16,133.16,0,0,1,25,128c4.69-8.79,19.66-33.39,47.35-49.38l18,19.75a48,48,0,0,0,63.66,70l14.73,16.2A112,112,0,0,1,128,192Zm6-95.43a8,8,0,0,1,3-15.72,48.16,48.16,0,0,1,38.77,42.64,8,8,0,0,1-7.22,8.71,6.39,6.39,0,0,1-.75,0,8,8,0,0,1-8-7.26A32.09,32.09,0,0,0,134,96.57Zm113.28,34.69c-.42.94-10.55,23.37-33.36,43.8a8,8,0,1,1-10.67-11.92A132.77,132.77,0,0,0,231.05,128a133.15,133.15,0,0,0-23.12-30.77C185.67,75.19,158.78,64,128,64a118.37,118.37,0,0,0-19.36,1.57A8,8,0,1,1,106,49.79,134,134,0,0,1,128,48c34.88,0,66.57,13.26,91.66,38.35,18.83,18.83,27.3,37.62,27.65,38.41A8,8,0,0,1,247.31,131.26Z"/></svg>
              </button>
            </div>
            <div class="auth__forgot"><a href="#">¿Olvidaste tu contraseña?</a></div>
          </div>

          <button type="submit" id="loginSubmit" class="auth__submit">
            Iniciar Sesión
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" class="btn__arrow"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
          </button>
          <p id="loginStatus" class="register__status" role="status" aria-live="polite"></p>
        </form>

        <footer class="auth__foot" data-mode="empresa">
          <p>¿Tu empresa aún no tiene cuenta? <a href="registro.html">Regístrate aquí</a></p>
          <p>¿Eres influencer? <a href="#">Únete aquí</a></p>
        </footer>
        <footer class="auth__foot" data-mode="admin" hidden>
          <p>¿Nuevo administrador? <a href="#" id="adminRegisterLink">Registrar acceso</a></p>
          <form id="adminRegisterForm" class="register__form" hidden novalidate>
            <div class="rfield"><label for="aName">Nombre</label><div class="rfield__wrap"><input id="aName" type="text" required placeholder="Nombre completo" style="padding-left:1rem" /></div></div>
            <div class="rfield"><label for="aEmail">Correo</label><div class="rfield__wrap"><input id="aEmail" type="email" required placeholder="nombre@and.com" style="padding-left:1rem" /></div></div>
            <div class="rfield"><label for="aPass">Contraseña</label><div class="rfield__wrap"><input id="aPass" type="password" required minlength="8" placeholder="Mínimo 8 caracteres" style="padding-left:1rem" /></div></div>
            <div class="rfield"><label for="aCode">Código de invitación</label><div class="rfield__wrap"><input id="aCode" type="text" required placeholder="Lo entrega un administrador" style="padding-left:1rem" /></div></div>
            <button type="submit" class="btn btn--block">Crear acceso de administrador</button>
            <p id="adminRegisterStatus" class="register__status" role="status" aria-live="polite"></p>
          </form>
        </footer>
      </section>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
