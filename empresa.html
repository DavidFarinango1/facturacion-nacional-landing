<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi panel — AND Local Ads</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin">
    <div class="admin__main">
      <header class="admin__top">
        <a href="index.html" class="sidebar__brand" style="padding:0;border:0"><img src="assets/logos-01.png" alt="AND" class="only-light" /><img src="assets/logos-02.png" alt="AND" class="only-dark" /></a>
        <h1 class="admin__title">Panel de mi empresa</h1>
        <div class="admin__user">
          <button id="themeToggle" class="theme-toggle theme-toggle--inline" aria-label="Cambiar tema" title="Cambiar tema">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <div class="admin__avatar" id="coAvatar">E</div>
          <div class="admin__who"><strong id="coName">Empresa</strong><span id="coEmail"></span></div>
          <button class="pbtn" id="logoutBtn">Salir</button>
        </div>
      </header>
      <main id="view" class="admin__view"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/store.js"></script>
  <script src="js/empresa.js"></script>
</body>
</html>
